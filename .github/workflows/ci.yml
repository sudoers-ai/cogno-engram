name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check cogno_engram cognobench tests examples
      - name: Type-check (mypy)
        run: mypy cogno_engram
      - name: Unit + bench-smoke tests
        # Postgres integration tests auto-skip without ENGRAM_TEST_DSN.
        run: pytest -q
      - name: EngramBench gate
        run: python3 cognobench.py --min-score 100

  integration:
    # The Postgres + Redis adapters, exercised against real service containers.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,postgres,redis]"
      - name: Integration tests (Postgres + Redis)
        env:
          ENGRAM_TEST_DSN: postgresql://postgres:postgres@localhost:5432/postgres
          ENGRAM_TEST_REDIS_URL: redis://localhost:6379/0
        run: pytest tests/test_postgres_integration.py tests/test_redis_integration.py -q
