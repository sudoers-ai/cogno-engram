name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # Adapter extras are installed so mypy type-checks the redis/postgres
          # adapters against their real stubs (without them every redis/psycopg
          # symbol is Any, which both defeats type-checking and turns legitimate
          # `# type: ignore` comments into "unused-ignore" failures).
          pip install -e ".[dev,postgres,redis]"
      - name: Lint (ruff)
        run: ruff check cogno_engram cognobench tests examples
      - name: Type-check (mypy)
        run: mypy cogno_engram
      - name: Unit + bench-smoke tests
        # Postgres/Redis integration tests auto-skip without their env vars; their
        # adapters are omitted from the coverage gate (covered by the integration job).
        run: pytest -q --cov=cogno_engram --cov-report=term-missing --cov-fail-under=90
      - name: EngramBench gate
        run: python3 cognobench.py --min-score 100

  integration:
    # The Postgres + Redis adapters, exercised against real service containers.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          # Named so the destructive-suite guard in tests/conftest.py lets it through: the
          # DROP TABLE suite refuses any database whose name does not say "test".
          POSTGRES_DB: engram_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,postgres,redis]"
      - name: Integration tests (Postgres + Redis)
        env:
          ENGRAM_TEST_DSN: postgresql://postgres:postgres@localhost:5432/engram_test
          ENGRAM_TEST_REDIS_URL: redis://localhost:6379/0
        # A suíte INTEIRA, não uma lista de ficheiros. A lista deixou `test_folding_parity.py`
        # e `test_fold_migration.py` de fora — testes que existem, passam na máquina de quem os
        # escreveu, e nunca correram aqui. Um ficheiro novo de integração escapava em silêncio;
        # com a suíte toda, os que não precisam de DSN correm na mesma e os que precisam agora
        # correm de facto.
        run: pytest -q

      - name: Integration tests under collation C
        env:
          ENGRAM_TEST_REDIS_URL: redis://localhost:6379/0
        # O collation onde o defeito da identidade de nó vivia — `lower('JOSÉ')` = `'josÉ'`. O
        # serviço acima corre `en_US.utf8`, onde o bug é INVISÍVEL: sem esta passagem, a
        # regressão que este trabalho fechou volta sem ninguém ver.
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c \
            "CREATE DATABASE engram_ctest TEMPLATE template0 LC_COLLATE 'C' LC_CTYPE 'C'"
          ENGRAM_TEST_DSN=postgresql://postgres:postgres@localhost:5432/engram_ctest pytest -q
