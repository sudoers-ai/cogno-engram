# Route A: PyPI Trusted Publishing (OIDC) — no tokens, no secrets.
# One-time setup on pypi.org (project → Publishing): register this repo +
# workflow file name `release.yml` + environment `pypi` as a trusted publisher.
# Then a `vX.Y.Z` tag push builds sdist+wheel and publishes.
name: release

on:
  push:
    tags: ["v*"]
  # Manual re-run without cutting a new tag — the one capability the deleted
  # publish.yml had that this did not. Pick the tag as the ref when dispatching.
  workflow_dispatch:

# A group so two publishes never interleave — two runs racing to push the same tag is how a
# registry ends up serving something nobody built.
#
# cancel-in-progress is FALSE here and must stay false. Killing a publish mid-flight is not a
# saving: it is a half-written registry tag, a partially uploaded release, a git tag left
# pointing at an artefact that was never finished — and the next run then trips over the wreck.
# Publishes QUEUE; they never die. The cancelling variant of this block lives in ci.yml, where a
# superseded run is worth nothing and dropping it costs nothing.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # OIDC — the whole point of trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
