[project]
name = "cogno-engram"
version = "0.1.0"
description = "Persistence substrate for the Cogno cognitive pipeline — memory store, knowledge graph, conversation buffer, and sleep-time consolidation (hypnos)"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Sudoers AI" }]
keywords = ["llm", "memory", "rag", "knowledge-graph", "pgvector", "redis", "agents", "consolidation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
# The CORE (ports + in-memory adapter) is dependency-free pure-Python.
# Real adapters and consolidation are opt-in extras below.
dependencies = []

[project.urls]
Homepage = "https://github.com/sudoers-ai/cogno-engram"
Repository = "https://github.com/sudoers-ai/cogno-engram"
Issues = "https://github.com/sudoers-ai/cogno-engram/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.8",
]
# Reference adapters — install only what you wire up.
postgres = ["psycopg[binary,pool]>=3.1", "pgvector>=0.2"]
redis = ["redis>=5.0"]
# hypnos consolidation drives an LLM via a cogno-synapse LLMBackend (host-injected).
# Sibling libs, imported under TYPE_CHECKING only (engram has no runtime dep on them):
#   cogno-synapse — the LLMBackend/Embedder protocols used by Tier-2/Tier-3 consolidation
#   cogno-anima   — the IntentResult/IdResult/StageMetrics types in cogno_engram.types
# Install them editable for full type-checking of those paths.

[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cogno_engram*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
# The Postgres/Redis adapters are exercised by the gated integration job, not the
# unit job — omit them from the unit coverage gate (they'd otherwise read as ~20%).
omit = [
    "cogno_engram/adapters/postgres.py",
    "cogno_engram/adapters/redis_buffer.py",
]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
files = ["cogno_engram"]
warn_unused_ignores = true
