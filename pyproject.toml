[project]
name = "cogno-engram"
version = "0.1.1"
description = "Persistence substrate for the Cogno cognitive pipeline — memory store, knowledge graph, conversation buffer, and sleep-time consolidation (hypnos)"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Vinicius Vale" }]
maintainers = [{ name = "Sudoers AI" }]
keywords = ["llm", "memory", "rag", "knowledge-graph", "pgvector", "redis", "agents", "consolidation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
# The CORE (ports + in-memory adapter) is dependency-free pure-Python.
# Real adapters and consolidation are opt-in extras below.
dependencies = []

[project.urls]
Homepage = "https://github.com/sudoers-ai/cogno-engram"
Repository = "https://github.com/sudoers-ai/cogno-engram"
Issues = "https://github.com/sudoers-ai/cogno-engram/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.8",
    # `tests/test_ci_runs_every_test_file.py` parses `.github/workflows/*.yml` with a real
    # YAML parser rather than a regex. A HARD dependency, never an `importorskip`: a guard
    # that skips itself when its parser is missing is the same "green means nothing" state
    # the guard exists to end.
    "pyyaml>=6.0",
]
# Reference adapters — install only what you wire up.
postgres = ["psycopg[binary,pool]>=3.1", "pgvector>=0.2"]
redis = ["redis>=5.0"]
# hypnos consolidation drives an LLM via a cogno-synapse LLMBackend (host-injected).
# Sibling libs, imported under TYPE_CHECKING only (engram has no runtime dep on them):
#   cogno-synapse — the LLMBackend/Embedder protocols used by Tier-2/Tier-3 consolidation
#   cogno-anima   — the IntentResult/IdResult/StageMetrics types in cogno_engram.types
# Install them editable for full type-checking of those paths.

[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cogno_engram*"]

[tool.setuptools.package-data]
# PEP 561. Without this marker INSIDE the built wheel, a type checker that finds this package in
# site-packages does not read a line of it: a consumer with `ignore_missing_imports = true` — which
# every repo in this stack sets, to keep third-party noise out of its own errors — sees the whole
# package silently become `Any`, and every disagreement across the seam stops being an error.
#
# Measured on cogno-host 2026-09-18: with the sibling libs installed as wheels (what its CI does),
# `mypy cogno_host` resolved 13 of the 16 pinned siblings and was blind to exactly the three that
# ship no marker — `cogno-anima`, `cogno-engram`, `cogno-observability`. A deliberately wrong name
# (`from cogno_engram import DEFINITELY_NOT_A_REAL_NAME`) came back GREEN for this package: the
# host was type-checking NOTHING of it. In the observability case that same blindness had been
# hiding a real contract error on the host's `main` for 17 days, through a green "Type-check
# (mypy)" step.
#
# Declared EXPLICITLY rather than left to `include-package-data`: modern setuptools discovers the
# file on its own, but a guarantee that rests on a default moves when the default does — and this
# one is invisible when it breaks, because the repo still LOOKS typed and only the install is not.
# `tests/test_py_typed_ships.py` holds it against a BUILT WHEEL.
cogno_engram = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Put the repo root on sys.path so `tests/` (no __init__.py) can import the
# top-level `cognobench` package under the bare `pytest` console script (which,
# unlike `python -m pytest`, does not add the cwd). Mirrors how cogno-anima's
# tests/ package achieves the same via __init__.py.
pythonpath = ["."]

[tool.coverage.run]
# The Postgres/Redis adapters are exercised by the gated integration job, not the
# unit job — omit them from the unit coverage gate (they'd otherwise read as ~20%).
omit = [
    "cogno_engram/adapters/postgres.py",
    "cogno_engram/adapters/redis_buffer.py",
]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
files = ["cogno_engram"]
warn_unused_ignores = true
